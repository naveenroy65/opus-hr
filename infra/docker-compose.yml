version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrms
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hrms
      PORT: 4000
      NODE_ENV: development
      JWT_SECRET: dev_secret_change_me
    depends_on:
      - db
      - redis
    ports:
      - "4000:4000"
    volumes:
      - ../backend:/app
      - /app/node_modules
  web:
    build:
      context: ../frontend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  db_data:
